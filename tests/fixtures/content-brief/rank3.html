<html><head><title>Best Trail Shoes</title></head>
<body><h1>Trail shoes explained</h1>
<p>Trail running shoes differ from road shoes in lug depth, a rock plate and a tougher upper. Waterproof Gore-Tex versions keep feet dry.</p>
<h2>Waterproof or breathable?</h2><p>Gore-Tex keeps water out but traps heat.</p>
<h2>Lug Depth &amp; Grip</h2><p>Lug depth is the biggest difference.</p></body></html>
